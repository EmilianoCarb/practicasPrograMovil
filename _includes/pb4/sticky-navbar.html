    Los links de Fútbol/Baloncesto/Motor/Polideportivo se clonan por JS desde
    #menuNavbar (ver script al final de practicab4.html), así no se duplica
    manualmente todo el mega-menú.
-->
<nav class="navbar-custom navbar-sticky fixed-top" id="stickyNavbar">
    <div class="container-fluid d-flex align-items-center">

        <!-- Logo M chico, siempre visible en la barra sticky -->

            <img src="./imagenes/logosMarca/M-Marca.png" width="30" height="30" alt="M">

            <button class="btn btn-light btn-sm mr-2">Suscríbete</button>

    </div>
